name: Security
description: Protect your accounts, devices, and data. Simple guides on password managers, two-factor logins, and safe browsing habits.
icon: 🛡️
order: 9
intro: Staying safe online does not need to be hard. We test and share simple security steps that anyone can follow. Learn how to pick a solid password manager, turn on two-factor logins, and avoid scams. Good security starts with small habits. Use unique passwords for each account. Keep your apps up to date. Each guide walks you through one task at a time so you can protect yourself quickly.
