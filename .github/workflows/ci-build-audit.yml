name: CI Build & SEO Audit Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  issues: write

jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Full history: the guards diff against a base commit, and one of the
          # candidates is HEAD~1 which does not exist in a depth-1 clone.
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Pre-Flight Multi-Point Quality Audit
        # On a push to main, origin/main and HEAD are the same commit, so a
        # `git diff origin/main...HEAD` is empty and both the single-post guard
        # and the slop gate used to pass without examining anything. These two
        # variables let src/lib/ci/git-base.mjs diff against what actually
        # changed. GITHUB_BASE_REF is provided by GitHub for pull requests;
        # `github.event.before` has to be passed explicitly.
        env:
          GITHUB_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: node src/scripts/ci-preflight-audit.mjs

      - name: Run Full Static Build & Pagefind Indexing
        env:
          GITHUB_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: npm run build

      - name: CI/CD Failure Alert Dispatcher
        if: failure()
        run: node scripts/ci_failure_notifier.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
