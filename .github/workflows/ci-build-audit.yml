name: CI Build & SEO Audit Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '*/30 * * * *'  # Every 30 min — also picks up any scheduled draft unlocks

permissions:
  contents: write

jobs:
  audit-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Scheduled Publish Check
        run: node src/scripts/run-scheduled-publish.mjs

      - name: Commit Draft Unlocks (if any)
        run: |
          git config --global user.name "PraveenTechWorld Publisher"
          git config --global user.email "hello@praveentechworld.com"
          git diff --quiet src/content/articles/ src/scripts/publish_schedule.json || \
            (git add src/content/articles/ src/scripts/publish_schedule.json && \
             git commit -m "publish: Auto-release scheduled draft(s) [$(date -u '+%Y-%m-%d %H:%M UTC')]" && \
             git push origin main)

      - name: Lint Duplicate Article Titles
        run: node src/scripts/lint-duplicate-titles.mjs

      - name: Verify Cover Image Integrity
        run: node src/scripts/lint-missing-images.mjs

      - name: Run SEO Compliance & E-E-A-T Audit
        run: node src/scripts/seo-lint-fixer.mjs

      - name: Build Static Production Distribution
        run: npx astro build

      - name: Generate Pagefind Search Indexes
        run: npx pagefind --site dist
