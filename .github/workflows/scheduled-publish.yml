name: Scheduled Article Publisher

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes - checks and publishes due scheduled drafts
  workflow_dispatch:          # Manual publish trigger from GitHub Actions UI

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # A 30-minute cron can overlap a slow run (npm ci + validation); two runs
    # racing on publish_schedule.json can double-publish the same draft.
    concurrency:
      group: scheduled-publish
      cancel-in-progress: false
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Process Scheduled Articles
        run: node src/scripts/run-scheduled-publish.mjs

      - name: Validate Published Content
        run: npm run validate-content

      - name: Commit & Push Published Changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/content/articles/ src/scripts/publish_schedule.json
            git commit -m "feat(publish): automated release of scheduled article"
            
            # Attempt direct push; if blocked by branch protection, open an automated PR
            if git push origin main 2>/dev/null; then
              echo "✅ Successfully pushed directly to main."
            else
              echo "⚠️ Direct push to main blocked by branch protection. Opening automated PR..."
              BRANCH_NAME="automated/scheduled-publish-$(date +%s)"
              git checkout -b "$BRANCH_NAME"
              git push origin "$BRANCH_NAME"
              gh pr create \
                --title "feat(publish): automated release of scheduled article" \
                --body "Automated release of due scheduled draft. Automatically opened because 'main' branch protection requires a pull request." \
                --base main \
                --head "$BRANCH_NAME"
              echo "✅ Successfully opened automated publish PR: $BRANCH_NAME"
            fi
          else
            echo "No scheduled changes to commit."
          fi

      - name: CI/CD Failure Alert Dispatcher
        if: failure()
        run: node scripts/ci_failure_notifier.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
