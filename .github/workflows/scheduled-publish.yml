name: Scheduled Article Review

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes - reports due drafts without mutating production
  workflow_dispatch:          # Manual read-only review from GitHub Actions UI

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Review Scheduled Articles
        run: node src/scripts/run-scheduled-publish.mjs --dry-run

      - name: Validate Published Content
        run: npm run validate-content
