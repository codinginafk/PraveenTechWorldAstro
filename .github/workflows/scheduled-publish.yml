name: Scheduled Article Publisher

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes - checks and publishes due scheduled drafts
  workflow_dispatch:          # Manual publish trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Process Scheduled Articles
        run: node src/scripts/run-scheduled-publish.mjs

      - name: Validate Published Content
        run: npm run validate-content

      - name: Commit & Push Published Changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/content/articles/ src/scripts/publish_schedule.json
            git commit -m "feat(publish): automated release of scheduled article"
            git push
          else
            echo "No scheduled changes to commit."
          fi
