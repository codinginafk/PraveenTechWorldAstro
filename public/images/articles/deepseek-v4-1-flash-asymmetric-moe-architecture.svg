<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg-glow-amber" cx="40%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bg-glow-crimson" cx="70%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bg-glow-blue" cx="15%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Gradients for Cards and Pipelines -->
    <linearGradient id="card-grad-encoder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="beam-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="beam-crimson" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#f87171" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1" />
    </linearGradient>

    <!-- Arrow Marker -->
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
    </marker>
    <marker id="arrow-crimson" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171" />
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="680" fill="#0b0f19" />
  <rect width="1200" height="680" fill="url(#bg-glow-blue)" />
  <rect width="1200" height="680" fill="url(#bg-glow-amber)" />
  <rect width="1200" height="680" fill="url(#bg-glow-crimson)" />

  <!-- Subtle Blueprint Grid -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="60" y1="0" x2="60" y2="680" />
    <line x1="260" y1="0" x2="260" y2="680" />
    <line x1="600" y1="0" x2="600" y2="680" />
    <line x1="940" y1="0" x2="940" y2="680" />
    <line x1="1140" y1="0" x2="1140" y2="680" />
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="590" x2="1200" y2="590" />
  </g>

  <!-- ==================== HEADER BAR ==================== -->
  <g id="header">
    <!-- DeepSeek Official Whale Logo -->
    <g transform="translate(60, 32)">
      <!-- Whale Body Silhouette -->
      <path d="M 12 36 C 18 20, 38 10, 56 16 C 68 20, 78 30, 84 40 C 92 34, 102 30, 114 34 C 118 36, 122 42, 118 46 C 110 54, 98 56, 88 54 C 76 66, 54 72, 34 68 C 18 64, 8 50, 12 36 Z" fill="#2563eb" />
      <path d="M 38 18 C 42 8, 52 2, 60 4 C 64 6, 62 14, 56 16 Z" fill="#38bdf8" /> <!-- Dorsal fin -->
      <circle cx="28" cy="34" r="3.5" fill="#ffffff" /> <!-- Whale Eye -->
      <!-- Water Droplets from blowhole -->
      <circle cx="44" cy="8" r="2.5" fill="#38bdf8" />
      <circle cx="50" cy="3" r="2" fill="#60a5fa" />
    </g>

    <text x="195" y="54" fill="#ffffff" font-size="24" font-weight="800" letter-spacing="-0.5">DeepSeek-V4.1-Flash</text>
    <text x="195" y="74" fill="#94a3b8" font-size="13" font-weight="500">Asymmetric Causal MoE Architecture &bull; 552B Backbone &bull; 1M Context Window</text>

    <!-- Visual Metaphor Pill Badge -->
    <rect x="880" y="36" width="260" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="902" cy="54" r="6" fill="#f59e0b" />
    <circle cx="918" cy="54" r="6" fill="#ef4444" />
    <text x="934" y="58" fill="#e2e8f0" font-size="12" font-weight="600">The Optical Neural Prism</text>
  </g>

  <!-- ==================== ARCHITECTURAL PIPELINE ==================== -->

  <!-- 1. INPUT STAGE -->
  <g id="input-stage" transform="translate(60, 130)">
    <rect width="210" height="430" rx="16" fill="url(#card-grad-encoder)" stroke="#334155" stroke-width="1.5" />
    <rect x="16" y="18" width="80" height="24" rx="6" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1" />
    <text x="26" y="34" fill="#60a5fa" font-size="11" font-weight="700" letter-spacing="1">INPUT STAGE</text>
    
    <text x="16" y="75" fill="#ffffff" font-size="18" font-weight="700">Massive Prompt</text>
    <text x="16" y="98" fill="#94a3b8" font-size="13">Up to 1,000,000 Tokens</text>

    <!-- Context Feature Cards -->
    <g transform="translate(16, 125)">
      <rect width="178" height="60" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="24" fill="#38bdf8" font-size="12" font-weight="700">📄 Multi-File Repos</text>
      <text x="12" y="44" fill="#94a3b8" font-size="11">50K+ lines of code &amp; tests</text>
    </g>

    <g transform="translate(16, 195)">
      <rect width="178" height="60" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="24" fill="#a78bfa" font-size="12" font-weight="700">🖼️ Native Multimodal</text>
      <text x="12" y="44" fill="#94a3b8" font-size="11">Direct patch embedding</text>
    </g>

    <g transform="translate(16, 265)">
      <rect width="178" height="60" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="24" fill="#34d399" font-size="12" font-weight="700">⚡ Fast Ingestion</text>
      <text x="12" y="44" fill="#94a3b8" font-size="11">114ms Time-To-First-Token</text>
    </g>

    <!-- Flow Arrow -->
    <path d="M 195 385 L 235 385" stroke="#fbbf24" stroke-width="3" marker-end="url(#arrow-amber)" />
  </g>

  <!-- 2. OPTICAL PRISM SPLIT: ENCODER & DECODER CORE -->
  <g id="encoder-stage" transform="translate(320, 130)">
    <!-- Amber Beam: 20-Layer Causal Encoder -->
    <rect width="360" height="200" rx="16" fill="url(#card-grad-encoder)" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="20" y="18" width="160" height="24" rx="6" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1" />
    <text x="30" y="34" fill="#fbbf24" font-size="11" font-weight="700" letter-spacing="1">PREFILL ENGINE &bull; 8B ACTIVE</text>
    
    <text x="20" y="72" fill="#ffffff" font-size="17" font-weight="700">20-Layer Causal Encoder</text>
    <text x="20" y="93" fill="#94a3b8" font-size="12">High-Throughput Sparse Ingestion (78% less load than V4 Pro)</text>

    <!-- Metric Badges -->
    <g transform="translate(20, 115)">
      <rect width="95" height="60" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="24" fill="#94a3b8" font-size="10" font-weight="600">PREFILL LOAD</text>
      <text x="12" y="48" fill="#fbbf24" font-size="18" font-weight="800">8B Params</text>
    </g>
    <g transform="translate(125, 115)">
      <rect width="95" height="60" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="24" fill="#94a3b8" font-size="10" font-weight="600">TTFT LATENCY</text>
      <text x="12" y="48" fill="#34d399" font-size="18" font-weight="800">114 ms</text>
    </g>
    <g transform="translate(230, 115)">
      <rect width="110" height="60" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="24" fill="#94a3b8" font-size="10" font-weight="600">API INPUT COST</text>
      <text x="12" y="48" fill="#38bdf8" font-size="18" font-weight="800">$0.14 / 1M</text>
    </g>
  </g>

  <!-- 3. CENTRAL CONNECTOR: KV CACHE COMPRESSION NODE -->
  <g id="kv-cache-node" transform="translate(320, 350)">
    <rect width="360" height="70" rx="12" fill="url(#cyan-glow)" stroke="#06b6d4" stroke-width="1.5" />
    <circle cx="36" cy="35" r="14" fill="#06b6d4" fill-opacity="0.3" stroke="#06b6d4" stroke-width="1" />
    <text x="31" y="40" fill="#38bdf8" font-size="14" font-weight="800">&darr;</text>

    <text x="65" y="28" fill="#ffffff" font-size="14" font-weight="700">Projected Global KV Cache Pinning</text>
    <text x="65" y="48" fill="#67e8f9" font-size="12">1/4 HBM Overhead (3.6GB vs 14.4GB) &bull; 1/8 SSD Paging &bull; Zero Turn Re-indexing</text>
  </g>

  <!-- 4. CRIMSON BEAM: 20-LAYER MOE DECODER -->
  <g id="decoder-stage" transform="translate(320, 440)">
    <rect width="360" height="180" rx="16" fill="url(#card-grad-encoder)" stroke="#ef4444" stroke-width="1.5" />
    <rect x="20" y="16" width="165" height="24" rx="6" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1" />
    <text x="30" y="32" fill="#f87171" font-size="11" font-weight="700" letter-spacing="1">DECODE ENGINE &bull; 16B ACTIVE</text>
    
    <text x="20" y="68" fill="#ffffff" font-size="17" font-weight="700">20-Layer Autoregressive Decoder</text>
    <text x="20" y="88" fill="#94a3b8" font-size="12">Dynamic MoE Routing across 552B Sparse Backbone</text>

    <!-- Metric Badges -->
    <g transform="translate(20, 105)">
      <rect width="95" height="58" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="22" fill="#94a3b8" font-size="10" font-weight="600">DECODE LOAD</text>
      <text x="12" y="44" fill="#f87171" font-size="17" font-weight="800">16B Params</text>
    </g>
    <g transform="translate(125, 105)">
      <rect width="95" height="58" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="22" fill="#94a3b8" font-size="10" font-weight="600">SPEED</text>
      <text x="12" y="44" fill="#34d399" font-size="17" font-weight="800">122 tok/s</text>
    </g>
    <g transform="translate(230, 105)">
      <rect width="110" height="58" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="22" fill="#94a3b8" font-size="10" font-weight="600">DEEPSWE v1.1</text>
      <text x="12" y="44" fill="#a78bfa" font-size="17" font-weight="800">74.2%</text>
    </g>
  </g>

  <!-- Flow Arrows connecting to Output -->
  <path d="M 680 530 L 730 530" stroke="#f87171" stroke-width="3" marker-end="url(#arrow-crimson)" />

  <!-- 5. OUTPUT & EXECUTION STAGE -->
  <g id="output-stage" transform="translate(740, 130)">
    <rect width="400" height="490" rx="16" fill="url(#card-grad-encoder)" stroke="#334155" stroke-width="1.5" />
    <rect x="20" y="18" width="130" height="24" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
    <text x="30" y="34" fill="#34d399" font-size="11" font-weight="700" letter-spacing="1">OUTPUT STREAM</text>

    <text x="20" y="75" fill="#ffffff" font-size="18" font-weight="700">Autonomous Reasoning</text>
    <text x="20" y="98" fill="#94a3b8" font-size="13">Up to 384,000 Output Tokens per Generation</text>

    <!-- Key Benchmark Scorecards -->
    <g transform="translate(20, 125)">
      <rect width="360" height="72" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="16" y="28" fill="#ffffff" font-size="14" font-weight="700">DeepSWE v1.1 Coding Benchmark</text>
      <text x="16" y="52" fill="#94a3b8" font-size="12">DeepSeek-V4.1-Flash (74.2%) vs Claude 3.7 (72.8%) vs V4 Pro (68.4%)</text>
      <rect x="285" y="18" width="60" height="36" rx="8" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1" />
      <text x="296" y="41" fill="#60a5fa" font-size="15" font-weight="800">74.2</text>
    </g>

    <g transform="translate(20, 210)">
      <rect width="360" height="72" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="16" y="28" fill="#ffffff" font-size="14" font-weight="700">GPQA Diamond (PhD Level Reasoning)</text>
      <text x="16" y="52" fill="#94a3b8" font-size="12">DeepSeek-V4.1-Flash (90.9%) vs Gemini 3.6 Flash (88.5%)</text>
      <rect x="285" y="18" width="60" height="36" rx="8" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
      <text x="296" y="41" fill="#34d399" font-size="15" font-weight="800">90.9</text>
    </g>

    <g transform="translate(20, 295)">
      <rect width="360" height="72" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="16" y="28" fill="#ffffff" font-size="14" font-weight="700">Terminal-Bench 2.1 (CLI Execution)</text>
      <text x="16" y="52" fill="#94a3b8" font-size="12">Direct Docker, PowerShell, and Bash syntax validation</text>
      <rect x="285" y="18" width="60" height="36" rx="8" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1" />
      <text x="296" y="41" fill="#fbbf24" font-size="15" font-weight="800">90.6</text>
    </g>

    <!-- Pro Deprecation Notice inside Diagram -->
    <g transform="translate(20, 380)">
      <rect width="360" height="85" rx="10" fill="#ef4444" fill-opacity="0.08" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1" />
      <text x="16" y="26" fill="#f87171" font-size="12" font-weight="700">🚨 DeepSeek-V4 Pro Deprecation Notice</text>
      <text x="16" y="48" fill="#e2e8f0" font-size="11">Starting Sept 14, 2026: Traffic to `deepseek-v4-pro` automatically routes</text>
      <text x="16" y="66" fill="#e2e8f0" font-size="11">to V4.1-Flash at lower pricing ($0.14/1M input vs $0.55/1M).</text>
    </g>
  </g>

  <!-- ==================== FOOTER WATERMARK ==================== -->
  <text x="60" y="650" fill="#475569" font-size="11" font-weight="600" letter-spacing="1">PRAVEENTECHWORLD ENGINEERING LABS &bull; BENCHMARKS &amp; ARCHITECTURAL ANALYSIS</text>
  <text x="1140" y="650" fill="#475569" font-size="11" font-weight="600" text-anchor="end">SEPTEMBER 2026</text>
</svg>
