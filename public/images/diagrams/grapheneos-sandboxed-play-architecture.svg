<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" fill="none">
  <!-- Background -->
  <rect width="960" height="480" fill="#FAF9F5" rx="16"/>
  <rect x="1" y="1" width="958" height="478" stroke="#E5E5DF" stroke-width="2" rx="15"/>

  <!-- Header -->
  <text x="480" y="44" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#18181B" letter-spacing="-0.02em">HOW GRAPHENEOS SANDBOXES GOOGLE PLAY SERVICES</text>
  <text x="480" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#71717A">Contrasting Stock Android's OS-root privileges with GrapheneOS's restricted unprivileged app sandbox</text>

  <!-- Left: Stock Android -->
  <g transform="translate(60, 100)">
    <rect width="390" height="340" rx="12" fill="#FFFFFF" stroke="#FECDD3" stroke-width="2"/>
    <rect width="390" height="40" rx="12" fill="#FFE4E6"/>
    <text x="195" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#BE123C" letter-spacing="0.05em">STOCK GOOGLE ANDROID (ROOT PRIVILEGES)</text>

    <!-- OS Layer (Root) -->
    <rect x="25" y="60" width="340" height="150" rx="8" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="1.5"/>
    <rect x="40" y="75" width="310" height="34" rx="6" fill="#F43F5E"/>
    <text x="195" y="97" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">GOOGLE PLAY SERVICES (SYSTEM ROOT UID 1000)</text>
    
    <text x="45" y="132" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#9F1239">⚠️ Hardware Permissions:</text>
    <text x="45" y="152" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#BE123C">• Full access to IMEI, SIM serial, MAC address</text>
    <text x="45" y="170" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#BE123C">• Scans nearby Wi-Fi BSSIDs even with GPS disabled</text>
    <text x="45" y="188" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#BE123C">• Unblockable socket access (348.4 requests/hour)</text>

    <!-- User Space Apps -->
    <rect x="25" y="225" width="340" height="85" rx="8" fill="#F4F4F5" stroke="#E4E4E7" stroke-width="1.5"/>
    <text x="40" y="248" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#27272A">User Applications Layer:</text>
    <text x="40" y="270" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#71717A">Banking, WhatsApp, Maps apps query Play Services directly.</text>
    <text x="40" y="290" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#E11D48">Play Services monitors all app lifecycle events and telemetry.</text>
  </g>

  <!-- Right: GrapheneOS Sandbox -->
  <g transform="translate(510, 100)">
    <rect width="390" height="340" rx="12" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="2"/>
    <rect width="390" height="40" rx="12" fill="#DCFCE7"/>
    <text x="195" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#15803D" letter-spacing="0.05em">GRAPHENEOS (UNPRIVILEGED SANDBOX)</text>

    <!-- Hardened OS Kernel -->
    <rect x="25" y="60" width="340" height="70" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
    <text x="40" y="86" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#14532D">HARDENED AOSP KERNEL &amp; MEMORY ALLOCATOR</text>
    <text x="40" y="106" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#166534">Zero Google binaries in base operating system. Zero idle pings.</text>

    <!-- Sandboxed Apps Box -->
    <rect x="25" y="145" width="340" height="165" rx="8" fill="#F4F4F5" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="40" y="160" width="310" height="34" rx="6" fill="#10B981"/>
    <text x="195" y="182" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#FFFFFF">SANDBOXED PLAY SERVICES (STANDARD APP UID)</text>

    <text x="45" y="218" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#065F46">🔒 Sandbox Protections:</text>
    <text x="45" y="238" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#047857">✓ Denied access to IMEI, SIM serials, and Android IDs</text>
    <text x="45" y="256" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#047857">✓ Network and Sensor toggles can be completely turned off</text>
    <text x="45" y="274" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#047857">✓ Passes Play Integrity: 85%+ banking apps work smoothly</text>
    <text x="45" y="292" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#047857">✓ FCM push sockets run unprivileged (12.1 pings/hr vs 348)</text>
  </g>
</svg>
