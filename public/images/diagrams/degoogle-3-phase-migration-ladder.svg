<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" fill="none">
  <!-- Background -->
  <rect width="960" height="480" fill="#FAF9F5" rx="16"/>
  <rect x="1" y="1" width="958" height="478" stroke="#E5E5DF" stroke-width="2" rx="15"/>

  <!-- Header -->
  <text x="480" y="44" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#18181B" letter-spacing="-0.02em">THE 3-PHASE DEGOOGLE MIGRATION BLUEPRINT</text>
  <text x="480" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#71717A">The safe, incremental ladder that prevents account lockouts and avoids migration burnout</text>

  <!-- Phase 1: Quick Wins -->
  <g transform="translate(40, 100)">
    <rect width="270" height="340" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect width="270" height="42" rx="12" fill="#EFF6FF"/>
    <text x="135" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#1D4ED8" letter-spacing="0.05em">PHASE 1: QUICK WINS</text>
    <rect x="75" y="55" width="120" height="24" rx="12" fill="#DBEAFE"/>
    <text x="135" y="71" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1E40AF">Day 1 • 30 Minutes</text>

    <!-- Checklist items -->
    <g transform="translate(20, 95)" font-family="system-ui, sans-serif" font-size="11.5" fill="#334155">
      <circle cx="10" cy="15" r="8" fill="#3B82F6"/>
      <path d="M7 15L9 17L13 13" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
      <text x="26" y="19" font-weight="700">1. Switch Web Browser</text>
      <text x="26" y="34" font-size="10.5" fill="#64748B">Brave, Firefox, LibreWolf</text>

      <circle cx="10" cy="65" r="8" fill="#3B82F6"/>
      <path d="M7 65L9 67L13 63" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
      <text x="26" y="69" font-weight="700">2. Set Search Engine</text>
      <text x="26" y="84" font-size="10.5" fill="#64748B">Brave Search or Kagi</text>

      <circle cx="10" cy="115" r="8" fill="#3B82F6"/>
      <path d="M7 115L9 117L13 113" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
      <text x="26" y="119" font-weight="700">3. Passwords to Bitwarden</text>
      <text x="26" y="134" font-size="10.5" fill="#64748B">Export from Chrome, import vault</text>

      <circle cx="10" cy="165" r="8" fill="#3B82F6"/>
      <path d="M7 165L9 167L13 163" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
      <text x="26" y="169" font-weight="700">4. Offline Navigation</text>
      <text x="26" y="184" font-size="10.5" fill="#64748B">Install Organic Maps / CoMaps</text>
    </g>

    <!-- Impact summary -->
    <rect x="16" y="285" width="238" height="40" rx="8" fill="#F8FAFC"/>
    <text x="135" y="303" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0F172A">Telemetry Cut: ~40%</text>
    <text x="135" y="318" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#64748B">Zero personal query profiling</text>
  </g>

  <!-- Phase 2: Cloud & Media -->
  <g transform="translate(345, 100)">
    <rect width="270" height="340" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect width="270" height="42" rx="12" fill="#F0FDF4"/>
    <text x="135" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#15803D" letter-spacing="0.05em">PHASE 2: CLOUD &amp; MEDIA</text>
    <rect x="75" y="55" width="120" height="24" rx="12" fill="#DCFCE7"/>
    <text x="135" y="71" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#166534">Week 1 to 2</text>

    <!-- Checklist items -->
    <g transform="translate(20, 95)" font-family="system-ui, sans-serif" font-size="11.5" fill="#334155">
      <circle cx="10" cy="15" r="8" fill="#10B981"/>
      <path d="M7 15L9 17L13 13" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
      <text x="26" y="19" font-weight="700">1. Google Takeout Export</text>
      <text x="26" y="34" font-size="10.5" fill="#64748B">Download Photos &amp; Drive archives</text>

      <circle cx="10" cy="65" r="8" fill="#10B981"/>
      <path d="M7 65L9 67L13 63" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
      <text x="26" y="69" font-weight="700">2. Immich / Ente Ingestion</text>
      <text x="26" y="84" font-size="10.5" fill="#64748B">Run immich-go to fix EXIF tags</text>

      <circle cx="10" cy="115" r="8" fill="#10B981"/>
      <path d="M7 115L9 117L13 113" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
      <text x="26" y="119" font-weight="700">3. Encrypted Cloud Storage</text>
      <text x="26" y="134" font-size="10.5" fill="#64748B">Nextcloud Hub or Proton Drive</text>

      <circle cx="10" cy="165" r="8" fill="#10B981"/>
      <path d="M7 165L9 167L13 163" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
      <text x="26" y="169" font-weight="700">4. Migrate 2FA Tokens</text>
      <text x="26" y="184" font-size="10.5" fill="#64748B">Switch to Aegis or Ente Auth</text>
    </g>

    <!-- Impact summary -->
    <rect x="16" y="285" width="238" height="40" rx="8" fill="#F8FAFC"/>
    <text x="135" y="303" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0F172A">Telemetry Cut: ~70%</text>
    <text x="135" y="318" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#64748B">Zero photo / document AI scraping</text>
  </g>

  <!-- Phase 3: Identity & Hardware -->
  <g transform="translate(650, 100)">
    <rect width="270" height="340" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect width="270" height="42" rx="12" fill="#FEF3C7"/>
    <text x="135" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#B45309" letter-spacing="0.05em">PHASE 3: IDENTITY &amp; OS</text>
    <rect x="75" y="55" width="120" height="24" rx="12" fill="#FDE68A"/>
    <text x="135" y="71" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#92400E">Month 1 to 2</text>

    <!-- Checklist items -->
    <g transform="translate(20, 95)" font-family="system-ui, sans-serif" font-size="11.5" fill="#334155">
      <circle cx="10" cy="15" r="8" fill="#F59E0B"/>
      <path d="M7 15L9 17L13 13" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
      <text x="26" y="19" font-weight="700">1. Custom Domain Name</text>
      <text x="26" y="34" font-size="10.5" fill="#64748B">Point MX to Proton / Tuta Mail</text>

      <circle cx="10" cy="65" r="8" fill="#F59E0B"/>
      <path d="M7 65L9 67L13 63" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
      <text x="26" y="69" font-weight="700">2. 90-Day Forwarding Ladder</text>
      <text x="26" y="84" font-size="10.5" fill="#64748B">Update bank &amp; tax emails gradually</text>

      <circle cx="10" cy="115" r="8" fill="#F59E0B"/>
      <path d="M7 115L9 117L13 113" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
      <text x="26" y="119" font-weight="700">3. Flash GrapheneOS</text>
      <text x="26" y="134" font-size="10.5" fill="#64748B">Pixel hardware with web flasher</text>

      <circle cx="10" cy="165" r="8" fill="#F59E0B"/>
      <path d="M7 165L9 167L13 163" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
      <text x="26" y="169" font-weight="700">4. Aurora Store &amp; F-Droid</text>
      <text x="26" y="184" font-size="10.5" fill="#64748B">85%+ banking apps verified</text>
    </g>

    <!-- Impact summary -->
    <rect x="16" y="285" width="238" height="40" rx="8" fill="#F8FAFC"/>
    <text x="135" y="303" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0F172A">Telemetry Cut: 99.4%</text>
    <text x="135" y="318" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#64748B">Full digital self-sovereignty</text>
  </g>

  <!-- Connecting Arrows -->
  <path d="M315 270 L340 270" stroke="#94A3B8" stroke-width="2" stroke-dasharray="3 3"/>
  <polygon points="340,266 345,270 340,274" fill="#94A3B8"/>

  <path d="M620 270 L645 270" stroke="#94A3B8" stroke-width="2" stroke-dasharray="3 3"/>
  <polygon points="645,266 650,270 645,274" fill="#94A3B8"/>
</svg>
