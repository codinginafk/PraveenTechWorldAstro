<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" fill="none">
  <!-- Background -->
  <rect width="960" height="480" fill="#FAF9F5" rx="16"/>
  <rect x="1" y="1" width="958" height="478" stroke="#E5E5DF" stroke-width="2" rx="15"/>

  <!-- Header -->
  <text x="480" y="44" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#18181B" letter-spacing="-0.02em">THE GOOGLE TAKEOUT PHOTO METADATA TRAP</text>
  <text x="480" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#71717A">Why uploading raw Takeout archives directly scrambles all your album dates and camera headers</text>

  <!-- Left Box: The Trap -->
  <g transform="translate(40, 100)">
    <rect width="260" height="340" rx="12" fill="#FFFFFF" stroke="#FECDD3" stroke-width="2"/>
    <rect width="260" height="36" rx="12" fill="#FFE4E6"/>
    <text x="130" y="23" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#BE123C" letter-spacing="0.05em">RAW TAKEOUT DUMP (BROKEN)</text>
    
    <!-- Image File -->
    <rect x="24" y="60" width="212" height="70" rx="8" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="1.5"/>
    <rect x="36" y="72" width="28" height="28" rx="4" fill="#F43F5E"/>
    <text x="50" y="90" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#FFFFFF">JPG</text>
    <text x="74" y="86" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#881337">IMG_2019.jpg</text>
    <text x="74" y="104" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#E11D48">⚠️ EXIF date stripped by Google</text>

    <!-- Plus Icon -->
    <circle cx="130" cy="150" r="14" fill="#F43F5E"/>
    <text x="130" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">+</text>

    <!-- JSON File -->
    <rect x="24" y="180" width="212" height="70" rx="8" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="1.5"/>
    <rect x="36" y="192" width="28" height="28" rx="4" fill="#BE123C"/>
    <text x="50" y="210" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="#FFFFFF">JSON</text>
    <text x="74" y="206" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#881337">IMG_2019.jpg.json</text>
    <text x="74" y="224" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#E11D48">Metadata dumped as text</text>

    <!-- Consequence Note -->
    <rect x="16" y="270" width="228" height="52" rx="6" fill="#FFF1F2"/>
    <text x="130" y="290" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#9F1239">Direct Upload Failure:</text>
    <text x="130" y="308" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#BE123C">All 2019 photos show as "Uploaded Today"</text>
  </g>

  <!-- Middle Box: The Fixer (immich-go CLI) -->
  <g transform="translate(340, 100)">
    <rect width="280" height="340" rx="12" fill="#18181B" stroke="#27272A" stroke-width="2"/>
    <rect width="280" height="36" rx="12" fill="#27272A"/>
    <circle cx="20" cy="18" r="5" fill="#EF4444"/>
    <circle cx="36" cy="18" r="5" fill="#F59E0B"/>
    <circle cx="52" cy="18" r="5" fill="#10B981"/>
    <text x="140" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#A1A1AA" letter-spacing="0.05em">TERMINAL WORKBENCH</text>

    <!-- Code Block -->
    <text x="20" y="70" font-family="monospace" font-size="11" font-weight="600" fill="#34D399">$ immich-go -server http://127.0.0.1:2283 \</text>
    <text x="35" y="92" font-family="monospace" font-size="11" font-weight="600" fill="#A7F3D0">-key $IMMICH_API_KEY \</text>
    <text x="35" y="114" font-family="monospace" font-size="11" font-weight="600" fill="#A7F3D0">upload from-google-photos \</text>
    <text x="35" y="136" font-family="monospace" font-size="11" font-weight="600" fill="#FBBF24">--skip-errors \</text>
    <text x="35" y="158" font-family="monospace" font-size="11" font-weight="600" fill="#FBBF24">--album-order name \</text>
    <text x="35" y="180" font-family="monospace" font-size="11" font-weight="600" fill="#E2E8F0">./Takeout/Google\ Photos/</text>

    <!-- Action Divider -->
    <line x1="20" y1="210" x2="260" y2="210" stroke="#3F3F46" stroke-dasharray="4 4"/>

    <!-- Automated Operations -->
    <text x="24" y="238" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#6EE7B7">✓ Parses JSON date timestamps</text>
    <text x="24" y="262" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#6EE7B7">✓ Re-injects EXIF tags to JPEG binary</text>
    <text x="24" y="286" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#6EE7B7">✓ Preserves original album hierarchies</text>
    <text x="24" y="310" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FCD34D">✓ Deduplicates Takeout chunk archives</text>
  </g>

  <!-- Right Box: The Verified Vault -->
  <g transform="translate(660, 100)">
    <rect width="260" height="340" rx="12" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="2"/>
    <rect width="260" height="36" rx="12" fill="#DCFCE7"/>
    <text x="130" y="23" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#15803D" letter-spacing="0.05em">RESTORED IMMICH / ENTE</text>

    <!-- Restored File -->
    <rect x="24" y="60" width="212" height="110" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
    <circle cx="52" cy="95" r="16" fill="#22C55E"/>
    <path d="M46 95L50 99L58 91" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="78" y="88" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#14532D">IMG_2019.jpg</text>
    <text x="78" y="106" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#166534">Date: July 14, 2019, 15:42</text>
    <text x="78" y="124" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#166534">GPS: 25.1972° N, 55.2744° E</text>
    <text x="78" y="142" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#166534">Camera: Pixel 3 (f/1.8, ISO 55)</text>

    <!-- Feature Grid -->
    <rect x="24" y="190" width="212" height="132" rx="8" fill="#F4F4F5"/>
    <text x="36" y="216" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#27272A">Vault Guarantees:</text>
    <text x="36" y="240" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#52525B">• 100% Offline Facial Recognition</text>
    <text x="36" y="262" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#52525B">• Chronological Timeline Order</text>
    <text x="36" y="284" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#52525B">• End-to-End Encrypted (Ente)</text>
    <text x="36" y="306" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#52525B">• Zero Commercial AI Model Training</text>
  </g>

  <!-- Flow Arrows -->
  <path d="M305 270 L335 270" stroke="#71717A" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
  <polygon points="335,266 343,270 335,274" fill="#71717A"/>

  <path d="M625 270 L655 270" stroke="#71717A" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
  <polygon points="655,266 663,270 655,274" fill="#71717A"/>
</svg>
